# config/default.conf
# Default configuration for ShapeNet experiments - Direct command line arguments
# Initialize BASE_ARGS to empty string to avoid "unbound variable" error
BASE_ARGS=""

# Base directory (used by shell script for cd)
BASE_DIR="/scratch/ngocbach/tmp/domain"

# Base configuration - always required
BASE_ARGS="$BASE_ARGS --base_dir $BASE_DIR"
BASE_ARGS="$BASE_ARGS --dataset MPIIFaceGazeNormDataset"
BASE_ARGS="$BASE_ARGS --data_folder /scratch/ngocbach/tmp/domain_mpii_gaze/MPIIFaceGazeOut/Label"

# Training parameters
BASE_ARGS="$BASE_ARGS --learning_rate 1e-4"
BASE_ARGS="$BASE_ARGS --lr_decay_rate 1e-6"
BASE_ARGS="$BASE_ARGS --weight_decay 0.01"
BASE_ARGS="$BASE_ARGS --epochs 100"
BASE_ARGS="$BASE_ARGS --decoder_epochs 30"
BASE_ARGS="$BASE_ARGS --save_freq 5"
BASE_ARGS="$BASE_ARGS --num_workers 8"
BASE_ARGS="$BASE_ARGS --max_samples_for_model_update 10000"
BASE_ARGS="$BASE_ARGS --max_samples_for_model_update 10000"
# BASE_ARGS="$BASE_ARGS --optimizer sgd"

# Model configuration
BASE_ARGS="$BASE_ARGS --model resnet50"
BASE_ARGS="$BASE_ARGS --output_list x y z id"
BASE_ARGS="$BASE_ARGS --output_dimension_list 1 1 1 1"
BASE_ARGS="$BASE_ARGS --encoder_loss_list RNC RNC RNC RNC"
BASE_ARGS="$BASE_ARGS --decoder_loss_list l1 l1 l1 CE"
BASE_ARGS="$BASE_ARGS --temp_list 2.0 2.0 2.0 2.0"
BASE_ARGS="$BASE_ARGS --w_list 1.0 1.0 1.0 1.0" # If use SupCon, w = 0.05, decoder = CE

# Domain-specific parameters
# BASE_ARGS="$BASE_ARGS --temp 1.0"
# BASE_ARGS="$BASE_ARGS --normalize_classification"


# Experiment settings
BASE_ARGS="$BASE_ARGS --data_prefix p00 p01 p02 p03 p04 p05 p06 p07 p08 p09 p10 p11 p12 p13 p14"
BASE_ARGS="$BASE_ARGS --trial iclr_submission"

# Optional flags that can be easily commented out:
